{% extends "base.html" %}
{% block title %}Employee | SkillBridge EMS{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-row">
        <label for="{{ field.id_for_label }}">
            {{ field.label }}
        </label>

        <div class="form-field">
            {{ field }}

            {% if field.errors %}
                <div class="field-error">
                    {{ field.errors }}
                </div>
            {% endif %}
        </div>
    </div>
    {% endfor %}
    <div class="action-buttons">
    <button type="submit">Save</button>
    <a href="{% url 'employees:employee_list' %}">Cancel</a>
    </div>
</form>
{% endblock %}
